[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "sunder-sync"
version = "0.1.0"
description = "Sunder sync service — imports Garmin Connect activities into Supabase."
requires-python = ">=3.12"
license = { text = "MIT" }
dependencies = [
  # Credential encryption at rest (spec 6.1).
  "cryptography>=44.0",
  # Garmin Connect access. `garth` handles the SSO flow, `garminconnect` wraps
  # the activity endpoints on top of it (spec section 3).
  "garth>=0.5.0",
  "garminconnect>=0.2.25",
  # Supabase access. httpx directly rather than the `supabase` SDK: the sync
  # needs a handful of REST calls, and going direct gives precise control over
  # the Prefer headers that make imports idempotent and over the error surface,
  # without a client library in between.
  "httpx>=0.27.0",
]

[project.scripts]
sunder-sync = "sunder_sync.cli:main"

[project.optional-dependencies]
dev = [
  "pytest>=8.3",
  "pytest-mock>=3.14",
  "mypy>=1.13",
  "ruff>=0.8",
  "python-dotenv>=1.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/sunder_sync"]

# ---------------------------------------------------------------------------
# Ruff
# ---------------------------------------------------------------------------
[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
  "E", "W",    # pycodestyle
  "F",         # pyflakes
  "I",         # isort
  "N",         # pep8-naming
  "UP",        # pyupgrade
  "B",         # bugbear
  "A",         # builtins shadowing
  "C4",        # comprehensions
  "SIM",       # simplify
  "PTH",       # pathlib over os.path
  "RET",       # return simplification
  "ARG",       # unused arguments
  "TRY",       # exception antipatterns
  "S",         # bandit — security lint, the reason this list is not just E/F
  "ANN",       # missing type annotations (spec 16: type hints everywhere)
  "D",         # docstrings
]
ignore = [
  "D203",   # conflicts with D211
  "D213",   # conflicts with D212
  "TRY003", # long messages inline are fine at this size
]

[tool.ruff.lint.per-file-ignores]
# Tests may assert, use hardcoded fake secrets, and skip docstrings — a
# well-named test is its own description, and a fake's methods are documented by
# the protocol they stand in for.
"tests/**" = [
  "S101",
  "S105",
  "S106",
  "D100",
  "D101",
  "D102",
  "D103",
  "D104",
  "D107",
  # Payload builders take **overrides: Any because the payloads they mimic are
  # heterogeneous JSON; narrowing it would only be a fiction.
  "ANN401",
]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.isort]
known-first-party = ["sunder_sync", "tests"]

# ---------------------------------------------------------------------------
# mypy — strict. Silent type errors in statistics and segment maths are exactly
# what the spec picked a typed stack to avoid (spec section 3).
# ---------------------------------------------------------------------------
[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true
disallow_any_explicit = false  # allowed with a justifying comment (spec 16)
files = ["src", "tests"]

[[tool.mypy.overrides]]
# These ship no type information.
module = ["garth.*", "garminconnect.*", "supabase.*"]
ignore_missing_imports = true

# ---------------------------------------------------------------------------
# pytest
# ---------------------------------------------------------------------------
[tool.pytest.ini_options]
testpaths = ["tests"]
# "." so `tests` is importable as a package (shared constants live in conftest).
pythonpath = ["src", "."]
addopts = "-ra --strict-markers"
markers = [
  "supabase: requires a live Supabase instance (local or a real project)",
]
